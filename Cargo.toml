[package]
name = "catering_invoice"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
printpdf = "0.8.2"
rfd = "0.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
  "multi-window",
  "single-instance",
  "tokio",
  "winit",
  "wgpu",
]
